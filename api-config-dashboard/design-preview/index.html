<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator — design preview</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/inter/index.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <style>
      /* Prototype-only chrome: the screen switcher. Not part of the design system. */
      .proto-bar {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2000;
        display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 14px;
        background: var(--surface-glass); backdrop-filter: blur(20px) saturate(150%);
        border: 1px solid var(--border-strong); box-shadow: var(--shadow-modal);
      }
      .proto-bar span { padding: 0 8px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
      .proto-sheet { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
