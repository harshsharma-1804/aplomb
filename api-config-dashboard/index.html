<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Orchestrator — Config Dashboard</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var palette = localStorage.getItem("orchestrator-palette");
          document.documentElement.setAttribute("data-palette",palette === "coastal" || palette === "monochrome" || palette === "orchid" ? palette : "current");
          var stored = localStorage.getItem("orchestrator-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (stored === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
